<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Usuários do GitHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🔍 Buscador de Usuários do GitHub</h1>
        
        <div class="search-box">
            <input type="text" id="username-input" placeholder="Digite o nome de usuário do GitHub">
            <button id="search-button">Buscar</button>
        </div>

        <div id="results-container">
            </div>

        <p id="error-message" class="hidden">Não foram encontrados usuários para esta pesquisa.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
